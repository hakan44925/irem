<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>İrem | KPSS Çağdaş Türk ve Dünya Tarihi (50 Kilit Bilgi)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-inner: #1a243d;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.15);
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #23314e;
      --tip-bg: rgba(14, 165, 233, 0.1);
      --tip-border: #38bdf8;
      --tip-text: #38bdf8;
      --gold: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      text-align: center;
      padding: 4px 2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-soft);
      color: #93c5fd;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 6px;
      text-transform: uppercase;
      border: 1px solid rgba(147, 197, 253, 0.25);
    }

    header h1 {
      font-size: 1.22rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }

    header p {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Üst Navigasyon & Arama */
    .search-box {
      width: 100%;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.84rem;
      outline: none;
      transition: border 0.2s;
    }
    .search-box:focus {
      border-color: var(--accent);
    }

    .unit-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .unit-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      white-space: nowrap;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Görünüm Sekmeleri */
    .tab-bar {
      display: flex;
      background: var(--card-bg);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    /* Flashcard (Kart) Modu */
    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      height: 410px;
      cursor: pointer;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .flashcard.flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border);
      background: var(--card-bg);
      overflow-y: auto;
    }

    .card-front {
      background: linear-gradient(180deg, #162035, #0d1424);
    }

    .card-back {
      transform: rotateY(180deg);
      background: linear-gradient(180deg, #18233c, #101728);
      border-color: #3b82f6;
    }

    .tag-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 6px;
    }

    .category-chip {
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.68rem;
    }

    .card-title-front {
      font-size: 1.08rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.4;
      text-align: left;
      margin: auto 0;
    }

    .card-answer-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 8px 0;
      text-align: left;
    }

    .answer-title {
      font-size: 0.94rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1.35;
    }

    .answer-desc {
      font-size: 0.84rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .tip-box {
      font-size: 0.78rem;
      color: var(--tip-text);
      background: var(--tip-bg);
      border-left: 3px solid var(--tip-border);
      padding: 8px 10px;
      border-radius: 6px;
      line-height: 1.45;
    }
    .tip-box strong {
      color: #ffffff;
    }

    .hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 6px;
    }

    .nav-controls {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    /* Liste Modu */
    .list-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-num {
      font-size: 0.72rem;
      font-weight: 800;
      color: #60a5fa;
      background: rgba(96, 165, 250, 0.12);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .list-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.35;
    }

    .list-desc {
      font-size: 0.82rem;
      line-height: 1.48;
      color: #cbd5e1;
    }

    .list-tip {
      font-size: 0.76rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      border-left: 2px solid #38bdf8;
      padding: 6px 8px;
      border-radius: 4px;
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">📘 KPSS ÇAĞDAŞ TARİH AKADEMİSİ</div>
      <h1>İrem'in Çağdaş Tarih Notları</h1>
      <p>Müfredattaki 5 Ünite • 50 Kilit Nokta Atışı Bilgi</p>
    </header>

    <!-- Arama Kutusu -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Konu veya kavram ara (Örn: Basmacı, Truman, NEP)..." oninput="handleSearch()">

    <!-- Ünite Filtre Butonları -->
    <div class="unit-scroll">
      <button class="filter-chip active" onclick="filterUnit('all', this)">Tümü (50)</button>
      <button class="filter-chip" onclick="filterUnit(1, this)">1. Ünite (20. Yy Başı)</button>
      <button class="filter-chip" onclick="filterUnit(2, this)">2. Ünite (II. Dünya Savaşı)</button>
      <button class="filter-chip" onclick="filterUnit(3, this)">3. Ünite (Soğuk Savaş)</button>
      <button class="filter-chip" onclick="filterUnit(4, this)">4. Ünite (Yumuşama)</button>
      <button class="filter-chip" onclick="filterUnit(5, this)">5. Ünite (Küreselleşen)</button>
    </div>

    <!-- Sekmeler (Kart Modu vs Liste Modu) -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchView('deck')">🃏 Kart Çalışma Modu</button>
      <button class="tab-btn" onclick="switchView('list')">📋 50 Madde Tümü (Liste)</button>
    </div>

    <!-- 1. KART ÇALIŞMA MODU -->
    <div id="deckSection">
      <div class="flashcard-wrapper" onclick="flipCard()">
        <div class="flashcard" id="mainCard">
          <!-- Ön Yüz -->
          <div class="card-face card-front">
            <div class="tag-row">
              <span class="category-chip" id="cardCategory">1. ÜNİTE</span>
              <span id="cardIndex" style="font-weight: 700; color: #60a5fa;">1 / 50</span>
            </div>
            <div class="card-title-front" id="cardTitleFront">Yükleniyor...</div>
            <div class="hint">Ayrıntılı sınav açıklamasını görmek için dokun 👆</div>
          </div>
          <!-- Arka Yüz -->
          <div class="card-face card-back">
            <div class="tag-row">
              <span class="category-chip" id="cardCategoryBack">DETAYLI ANALİZ</span>
              <span style="color: #f59e0b; font-weight: 700;">KPSS NOTU 📌</span>
            </div>
            <div class="card-answer-body">
              <div class="answer-title" id="cardAnswerTitle">Başlık</div>
              <div class="answer-desc" id="cardAnswer">Açıklama yükleniyor...</div>
              <div class="tip-box" id="cardNote">İpucu...</div>
            </div>
            <div class="hint">Kartı çevirmek için tekrar dokun 👆</div>
          </div>
        </div>
      </div>

      <div class="nav-controls" style="margin-top: 10px;">
        <button class="btn btn-secondary" onclick="prevCard()">◀ Önceki</button>
        <button class="btn btn-primary" onclick="nextCard()">Sonraki ▶</button>
      </div>
    </div>

    <!-- 2. LİSTE MODU -->
    <div id="listSection" class="hidden">
      <div class="list-wrapper" id="listContainer"></div>
    </div>
  </div>

    let currentFiltered = [...items];
    let currentIndex = 0;
    let selectedUnit = 'all';

    function flipCard() {
      document.getElementById('mainCard').classList.toggle('flipped');
    }

    function updateCardView() {
      const mainCard = document.getElementById('mainCard');
      mainCard.classList.remove('flipped');

      if (currentFiltered.length === 0) {
        document.getElementById('cardCategory').innerText = "BULUNAMADI";
        document.getElementById('cardIndex').innerText = "0 / 0";
        document.getElementById('cardTitleFront').innerText = "Arama kriterine uygun bilgi kartı bulunamadı.";
        document.getElementById('cardAnswerTitle').innerText = "-";
        document.getElementById('cardAnswer').innerText = "Lütfen arama terimini değiştirin veya 'Tümü' filtresine tıklayın.";
        document.getElementById('cardNote').innerText = "";
        return;
      }

      const item = currentFiltered[currentIndex];
      setTimeout(() => {
        document.getElementById('cardCategory').innerText = item.unitName;
        document.getElementById('cardCategoryBack').innerText = item.unitName;
        document.getElementById('cardIndex').innerText = `${currentIndex + 1} / ${currentFiltered.length}`;
        document.getElementById('cardTitleFront').innerText = item.title;
        document.getElementById('cardAnswerTitle').innerText = item.title;
        document.getElementById('cardAnswer').innerText = item.desc;
        document.getElementById('cardNote').innerHTML = `<strong>ÖSYM / Sınav Notu:</strong> ${item.tip}`;
      }, 120);
    }

    function nextCard() {
      if (currentFiltered.length === 0) return;
      currentIndex = (currentIndex + 1) % currentFiltered.length;
      updateCardView();
    }

    function prevCard() {
      if (currentFiltered.length === 0) return;
      currentIndex = (currentIndex - 1 + currentFiltered.length) % currentFiltered.length;
      updateCardView();
    }

    function filterUnit(unit, btnElement) {
      selectedUnit = unit;
      const buttons = document.querySelectorAll('.filter-chip');
      buttons.forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      currentFiltered = items.filter(item => {
        const matchesUnit = (selectedUnit === 'all') || (item.unit === selectedUnit);
        const matchesSearch = !q || 
          item.title.toLowerCase().includes(q) || 
          item.desc.toLowerCase().includes(q) || 
          item.tip.toLowerCase().includes(q);
        return matchesUnit && matchesSearch;
      });

      currentIndex = 0;
      updateCardView();
      renderListView();
    }

    function switchView(view) {
      const deck = document.getElementById('deckSection');
      const list = document.getElementById('listSection');
      const tabs = document.querySelectorAll('.tab-btn');

      if (view === 'deck') {
        deck.classList.remove('hidden');
        list.classList.add('hidden');
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
      } else {
        deck.classList.add('hidden');
        list.classList.remove('hidden');
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
        renderListView();
      }
    }

    function renderListView() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      if (currentFiltered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 20px; color: #94a3b8;">Aramaya uygun sonuç bulunamadı.</div>`;
        return;
      }

      currentFiltered.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'list-card';
        card.innerHTML = `
          <div class="list-header">
            <span class="category-chip">${item.unitName}</span>
            <span class="list-num">#${idx + 1}</span>
          </div>
          <div class="list-title">${item.title}</div>
          <div class="list-desc">${item.desc}</div>
          <div class="list-tip">📌 <strong>ÖSYM İpucu:</strong> ${item.tip}</div>
        `;
        container.appendChild(card);
      });
    }

    // İlk açılış
    updateCardView();
  </script>
